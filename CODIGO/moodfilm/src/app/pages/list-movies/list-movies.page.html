<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button fill="clear" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>{{ nombreLista }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [ngClass]="getListaClass()">
  <!-- Cargando -->
  <div *ngIf="loading" class="loading-text">
    Cargando películas...
  </div>

  <div *ngIf="!loading && peliculas.length === 0" class="empty-container">
    <div class="empty-icon-wrapper">
      <ion-icon name="film-outline"></ion-icon>
    </div>
    <h2>¡Tu lista está esperando!</h2>
    <p>Aún no has añadido ninguna película aquí.</p>
    <p>Explora la cartelera y guarda tus favoritas.</p>
    <ion-button fill="clear" color="light" (click)="irABuscar()">
      <ion-icon name="search-outline" slot="start"></ion-icon>
      Buscar películas
    </ion-button>
  </div>

  <!-- cuando hay pelis -->
  <ion-grid *ngIf="!loading && peliculas.length > 0">
    <ion-row>
      <ion-col size="12" size-sm="6" size-md="4" size-lg="3" *ngFor="let peli of peliculas">

        <ion-card class="movie-card">
          <div class="poster-container" (click)="verFicha(peli)">
            <img [src]="getPosterUrl(peli.posterPath)" [alt]="peli.titulo">
          </div>
          <ion-card-header (click)="verFicha(peli)">
            <ion-card-title>{{ peli.titulo }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <ion-button expand="block" fill="outline" color="danger" size="small" (click)="eliminarPelicula(peli)">
              <ion-icon name="trash-outline" slot="start"></ion-icon>
              Quitar
            </ion-button>
          </ion-card-content>
        </ion-card>

      </ion-col>
    </ion-row>
  </ion-grid>

</ion-content>

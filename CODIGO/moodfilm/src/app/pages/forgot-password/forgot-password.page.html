<ion-content class="login-content">
  <div class="login-container">

    <div class="login-header">
      <div class="logo">
        <img src="assets/img/logo_moodfilm_png.png" alt="MoodFilm Logo">
      </div>
      <p class="app-subtitle">Recupera tu contraseña</p>
    </div>

    <!-- Formulario -->
    <div class="login-form" *ngIf="!enviado">
      <p style="text-align:center; color: var(--ion-color-medium); margin-bottom: 20px; font-size: 14px;">
        Introduce tu correo y te enviaremos un enlace para restablecer tu contraseña.
      </p>

      <div class="input-group">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <ion-input type="email" placeholder="Correo electrónico"
          [(ngModel)]="email" class="custom-input">
        </ion-input>
      </div>

      <ion-button expand="block" class="btn-login" (click)="enviar()" [disabled]="cargando">
        {{ cargando ? 'Enviando...' : 'Enviar enlace' }}
      </ion-button>
    </div>

    <!-- Confirmación -->
    <div class="login-form" *ngIf="enviado" style="text-align:center;">
      <ion-icon name="mail-outline" style="font-size: 48px; color: var(--ion-color-primary);"></ion-icon>
      <p style="margin-top: 16px;">Si el correo está registrado, recibirás el enlace en unos minutos.</p>
      <p style="color: var(--ion-color-medium); font-size: 13px;">Revisa también tu carpeta de spam.</p>
    </div>

    <div class="register-link">
      <a (click)="goToLogin()">← Volver al inicio de sesión</a>
    </div>

  </div>
</ion-content>

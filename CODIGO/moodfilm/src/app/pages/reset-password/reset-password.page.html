<ion-content class="login-content">
  <div class="login-container">

    <div class="login-header">
      <div class="logo">
        <img src="assets/img/logo_moodfilm_png.png" alt="MoodFilm Logo">
      </div>
      <p class="app-subtitle">Nueva contraseña</p>
    </div>

    <div class="login-form" *ngIf="!exito">

      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input type="password" placeholder="Nueva contraseña"
          [(ngModel)]="nuevaPassword" class="custom-input">
        </ion-input>
      </div>

      <div class="input-group">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <ion-input type="password" placeholder="Confirmar contraseña"
          [(ngModel)]="confirmarPassword" class="custom-input">
        </ion-input>
      </div>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <ion-button expand="block" class="btn-login" (click)="resetear()"
        [disabled]="cargando || !token">
        {{ cargando ? 'Guardando...' : 'Cambiar contraseña' }}
      </ion-button>
    </div>

    <div class="login-form" *ngIf="exito" style="text-align:center;">
      <p style="font-size: 40px;">✅</p>
      <p>¡Contraseña actualizada! Redirigiendo al login...</p>
    </div>

  </div>
</ion-content>

<style>
  #manual-splash {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: linear-gradient(135deg, #6A0DAD 0%, #4B0082 100%);
    display: flex; align-items: center; justify-content: center;
    z-index: 999999;
    transition: opacity 0.5s ease;
  }
  .splash-content { text-align: center; font-family: sans-serif; }
  .splash-logo { width: 180px; animation: heartbeat 2s infinite; }
  .splash-text { color: #ead029; margin-top: 20px; font-weight: bold; letter-spacing: 2px; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  .fade-out { opacity: 0; pointer-events: none; }
</style>

<div id="manual-splash">
  <div class="splash-content">
    <img src="assets/img/logo_moodfilm_png.png" class="splash-logo">
    <p class="splash-text">PREPARANDO TUS PALOMITAS...</p>
  </div>
</div>
